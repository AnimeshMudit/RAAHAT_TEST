<!DOCTYPE html>
<html class="h-full" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>RAAHAT | Welcome</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/static/ui.css" />
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2070');
            --nordic-breeze: #D3DDE7;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        /* High-Fidelity Parallax Background */
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            backdrop-filter: blur(2px);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nordic-btn {
            background: var(--nordic-breeze);
            color: #0f172a;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nordic-btn:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(211, 221, 231, 0.5);
            filter: brightness(1.1);
        }

        input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: white !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="parallax-bg" id="bg-layer"></div>
    <div class="bg-overlay"></div>
    <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <div class="glass-panel spotlight-card tilt-element w-full max-w-md p-10 relative z-10" id="login-card">
        <div class="text-center mb-12 reveal-text reveal-delay-1">
            <h1 class="text-4xl font-bold tracking-[0.25em] text-white mb-3">RAAHAT</h1>
            <p class="text-[10px] text-orange-500 font-bold tracking-[0.4em] uppercase opacity-80">Sanctuary Awaits</p>
        </div>

        <form class="space-y-6">
            <div class="reveal-text reveal-delay-2">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-slate-400 mb-3 ml-1">Email
                    Address</label>
                <input type="email" id="email"
                    class="w-full rounded-2xl px-6 py-4 focus:outline-none transition-all placeholder:text-white/20"
                    placeholder="name@example.com">
            </div>

            <div class="reveal-text reveal-delay-3">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-slate-400 mb-3 ml-1">Secret Key</label>
                <input type="password" id="password"
                    class="w-full rounded-2xl px-6 py-4 focus:outline-none transition-all placeholder:text-white/20"
                    placeholder="••••••••">
            </div>

            <div class="reveal-text reveal-delay-4">
                <button type="button" id="loginBtn"
                    class="nordic-btn w-full font-bold uppercase tracking-widest rounded-2xl px-4 py-5 mt-4 text-xs">
                    Enter Sanctuary
                </button>
                <p id="errorMsg" class="text-xs mt-2 hidden text-center font-medium"></p>
            </div>

            <div class="flex items-center my-8 reveal-text reveal-delay-4">
                <div class="flex-grow border-t border-white/5"></div>
                <span class="px-4 text-[9px] text-slate-500 uppercase tracking-[0.3em]">Encrypted Link</span>
                <div class="flex-grow border-t border-white/5"></div>
            </div>

            <div class="reveal-text reveal-delay-4">
                <button type="button" onclick="handleGoogleLogin()"
                    class="w-full bg-white/90 backdrop-blur-md rounded-2xl px-4 py-4 flex items-center justify-center gap-3 text-slate-700 font-bold text-xs hover:bg-white transition-all transform hover:scale-[1.01]">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16px">
                    SIGN IN WITH GOOGLE
                </button>
            </div>
        </form>

        <div class="mt-10 text-center border-t border-white/5 pt-8 reveal-text reveal-delay-4">
            <p class="text-xs text-slate-400 tracking-wide" id="toggleText">
                New to the path?
                <button type="button" id="toggleModeBtn"
                    class="ml-1 inline-flex items-center justify-center rounded-full px-3 py-2 font-bold text-white transition-colors hover:text-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-400/40 focus:ring-offset-0">
                    Begin Journey
                </button>
            </p>
            <p class="text-[10px] text-slate-500 mt-4 px-2 italic">
                ⚠️ RAAHAT is not a substitute for professional mental health care.
            </p>
        </div>
    </div>

    <script src="/static/ui.js"></script>
    <script>
        // --- 1. CONFIGURATION & SESSION CHECK ---
        const existingUserId = localStorage.getItem("user_id");
        if (existingUserId && existingUserId !== "null" && existingUserId !== "undefined") {
            window.location.href = "/dashboard";
        }

        const SUPABASE_URL = "https://duyhbflxfjdhdyqjxkoz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1eWhiZmx4ZmpkaGR5cWp4a296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyODI5NDIsImV4cCI6MjA4Nzg1ODk0Mn0.L38bpH07Ga2-1RG7Bn4EyVaWdXKWUA3AQNA6jQr-Dyw";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. PARALLAX & ADVANCED PARTICLES ---
        const bg = document.getElementById('bg-layer');
        let globalMouseX = window.innerWidth / 2;
        let globalMouseY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            globalMouseX = e.clientX;
            globalMouseY = e.clientY;
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            bg.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
        });

        // Advanced Zen Firefly Particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.opacity = Math.random() * 0.6 + 0.1;
            }
            update() {
                let dx = globalMouseX - this.x;
                let dy = globalMouseY - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = 150;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < maxDistance) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 50;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 50;
                    }
                }

                // Slow drift
                this.baseY -= 0.2;
                if (this.baseY < -10) this.baseY = canvas.height + 10;
            }
            draw() {
                ctx.fillStyle = `rgba(249, 115, 22, ${this.opacity})`; // Orange glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 3. AUTH LOGIC ---
        let isLoginMode = true;
        const actionBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const toggleText = document.getElementById('toggleText');

        toggleText.addEventListener('click', (e) => {
            const toggleButton = e.target.closest('#toggleModeBtn');
            if (!toggleButton) {
                return;
            }

            e.preventDefault();
            isLoginMode = !isLoginMode;
            actionBtn.textContent = isLoginMode ? "Enter Sanctuary" : "Begin Journey";
            toggleText.innerHTML = isLoginMode ?
                'New to the path? <button type="button" id="toggleModeBtn" class="ml-1 inline-flex items-center justify-center rounded-full px-3 py-2 font-bold text-white transition-colors hover:text-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-400/40 focus:ring-offset-0">Begin Journey</button>' :
                'Already on the path? <button type="button" id="toggleModeBtn" class="ml-1 inline-flex items-center justify-center rounded-full px-3 py-2 font-bold text-white transition-colors hover:text-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-400/40 focus:ring-offset-0">Enter Sanctuary</button>';
        });

        async function handleGoogleLogin() {
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}/auth/callback`
                    }
                });
                if (error) throw error;
            } catch (err) {
                showError("Google sign-in initialization failed.");
            }
        }

        actionBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError("Keys required for entry.");
                return;
            }

            actionBtn.disabled = true;
            actionBtn.textContent = "Validating...";
            const endpoint = isLoginMode ? '/api/login' : '/api/signup';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password })
                });

                const data = await response.json();
                if (response.ok) {
                    if (!isLoginMode) {
                        localStorage.setItem("pending_email", email);
                        navigateWithTransition("/verify");
                    } else {
                        localStorage.setItem("user_id", data.user_id);
                        localStorage.setItem("username", data.username);
                        navigateWithTransition("/dashboard");
                    }
                } else {
                    showError(data.detail || "Access Denied.");
                }
            } catch (err) {
                showError("Network interference detected.");
            } finally {
                actionBtn.disabled = false;
                actionBtn.textContent = isLoginMode ? "Enter Sanctuary" : "Begin Journey";
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.className = "text-xs mt-2 text-orange-400 text-center font-medium reveal-text";
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>

</html>
