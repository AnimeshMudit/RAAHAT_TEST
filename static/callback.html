<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>RAAHAT | Connecting...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(249,115,22,0.2);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 13px; color: #94a3b8; letter-spacing: 0.1em; }
        .error { color: #ef4444; font-size: 13px; display: none; text-align: center; max-width: 320px; }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <p>Verifying with Google...</p>
    <p class="error" id="errMsg"></p>

    <script>
        const SUPABASE_URL = "https://duyhbflxfjdhdyqjxkoz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1eWhiZmx4ZmpkaGR5cWp4a296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyODI5NDIsImV4cCI6MjA4Nzg1ODk0Mn0.L38bpH07Ga2-1RG7Bn4EyVaWdXKWUA3AQNA6jQr-Dyw";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showError(msg) {
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('p').style.display = 'none';
            const errEl = document.getElementById('errMsg');
            errEl.textContent = msg + " Redirecting to login...";
            errEl.style.display = 'block';
            setTimeout(() => { window.location.href = '/login'; }, 3000);
        }

        async function handleCallback() {
            try {
                // Supabase exchangeCodeForSession reads the ?code= param automatically
                // and uses the stored PKCE code_verifier from sessionStorage.
                const { data, error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href);

                if (error || !data?.session?.user) {
                    // Fallback: try getSession (handles implicit / fragment flows)
                    const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                    if (sessionError || !sessionData?.session?.user) {
                        showError("Google sign-in failed.");
                        return;
                    }
                    return finalize(sessionData.session.user);
                }

                finalize(data.session.user);
            } catch (e) {
                showError("Unexpected error: " + e.message);
            }
        }

        async function finalize(user) {
            const email = user.email;
            try {
                // Sync with our backend DB to get/create internal user_id
                const res = await fetch('/api/sync-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!res.ok) {
                    showError("Account sync failed.");
                    return;
                }

                const data = await res.json();
                localStorage.setItem("user_id", String(data.user_id));
                localStorage.setItem("username", data.username || email);

                // Go to dashboard
                window.location.href = "/dashboard";

            } catch (e) {
                showError("Network error during sync.");
            }
        }

        handleCallback();
    </script>
</body>

</html>
