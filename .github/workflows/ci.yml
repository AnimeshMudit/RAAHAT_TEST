name: RAAHAT Security & Safety Validation CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safety evaluation harness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dummy-supabase-url.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'dummy-supabase-key' }}
        run: |
          python tests/test_safety_evaluation.py

      - name: Run backend smoke tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "⚠️ CI secrets not available (e.g., PR from fork). Skipping live server smoke test."
          else
            # Start the FastAPI server in the background
            nohup python -m uvicorn app.api.server:app --host 127.0.0.1 --port 8000 &
            # Wait for server to boot
            sleep 5
            # Run the smoke test
            python smoke_test.py
          fi
